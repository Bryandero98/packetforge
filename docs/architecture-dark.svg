<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 640" role="img" aria-label="Diagram: an AI agent via MCP tools or a REST client both call PacketForge's services, which read and write Postgres with pgvector, optionally embedding notes and queries through Gemini, and format a task's full context through a PacketAdapter on the way back out.">
          <style>
    text { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; fill: #f1ead9; }
    .mono { font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-weight: 600; }
    .label { fill: #a89a80; }
  </style>
          <defs>
            <marker id="pf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
            </marker>
          </defs>

          <!-- clients, stacked left -->
          <g>
            <rect x="40" y="110" width="210" height="100" rx="5" fill="#2c2438" stroke="#b48fd6" stroke-width="1.5"></rect>
            <text x="145" y="150" text-anchor="middle" class="title" font-size="15.5">AI agent</text>
            <text x="145" y="174" text-anchor="middle" class="label mono" font-size="11">e.g. Claude Code</text>
            <text x="145" y="190" text-anchor="middle" class="label mono" font-size="11">via MCP tools</text>
          </g>
          <g>
            <rect x="40" y="260" width="210" height="100" rx="5" fill="#1e1a13" stroke="#f1ead9" stroke-width="1.5"></rect>
            <text x="145" y="300" text-anchor="middle" class="title" font-size="15.5">REST client</text>
            <text x="145" y="324" text-anchor="middle" class="label mono" font-size="11">human, script, n8n</text>
            <text x="145" y="340" text-anchor="middle" class="label mono" font-size="11">via HTTP</text>
          </g>

          <!-- gemini, above services -->
          <g>
            <rect x="380" y="20" width="230" height="90" rx="5" fill="#1e1a13" stroke="#f1ead9" stroke-width="1.4" stroke-dasharray="4 3"></rect>
            <text x="495" y="52" text-anchor="middle" class="title mono" font-size="13">Gemini embedding</text>
            <text x="495" y="76" text-anchor="middle" class="label mono" font-size="11">rate-limited, best-effort</text>
          </g>
          <g stroke="currentColor" fill="none" color="#a89a80" stroke-dasharray="3 4">
            <line x1="495" y1="110" x2="495" y2="164" stroke-width="1.4" marker-end="url(#pf-arrow)"></line>
          </g>
          <text x="515" y="140" text-anchor="start" class="mono" font-size="10.5" fill="#a89a80">embeds note / query</text>

          <!-- services -->
          <g>
            <rect x="380" y="166" width="230" height="150" rx="5" fill="#1a2e2b" stroke="#6cc4ba" stroke-width="1.5"></rect>
            <text x="495" y="212" text-anchor="middle" class="title" font-size="16">services</text>
            <text x="495" y="238" text-anchor="middle" class="label mono" font-size="11">Graph · Decision · Debt</text>
            <text x="495" y="254" text-anchor="middle" class="label mono" font-size="11">Search · Projects</text>
            <text x="495" y="278" text-anchor="middle" class="label mono" font-size="10.5">one MCP tool per REST route</text>
          </g>

          <!-- postgres -->
          <g>
            <rect x="720" y="166" width="260" height="150" rx="5" fill="#1a2e2b" stroke="#6cc4ba" stroke-width="1.5"></rect>
            <text x="850" y="208" text-anchor="middle" class="title" font-size="15.5">Postgres + pgvector</text>
            <text x="850" y="236" text-anchor="middle" class="label mono" font-size="11">projects → tasks →</text>
            <text x="850" y="252" text-anchor="middle" class="label mono" font-size="11">decisions / debt (+ embedding)</text>
            <text x="850" y="276" text-anchor="middle" class="label mono" font-size="10.5">HNSW cosine index</text>
          </g>

          <!-- packet adapter, below, reached via orthogonal path -->
          <g>
            <rect x="1000" y="410" width="240" height="120" rx="5" fill="#2c2438" stroke="#b48fd6" stroke-width="1.5"></rect>
            <text x="1120" y="450" text-anchor="middle" class="title" font-size="15">PacketAdapter</text>
            <text x="1120" y="476" text-anchor="middle" class="label mono" font-size="11">cursor → Markdown</text>
            <text x="1120" y="492" text-anchor="middle" class="label mono" font-size="11">generic-json → JSON</text>
          </g>

          <!-- client -> services, gentle V -->
          <g stroke="currentColor" fill="none" color="#b48fd6">
            <line x1="250" y1="170" x2="376" y2="212" stroke-width="1.5" marker-end="url(#pf-arrow)"></line>
          </g>
          <text x="266" y="228" text-anchor="start" class="mono" font-size="10.5" fill="#b48fd6">calls a tool</text>

          <g stroke="currentColor" fill="none" color="#f1ead9">
            <line x1="250" y1="300" x2="376" y2="264" stroke-width="1.5" marker-end="url(#pf-arrow)"></line>
          </g>
          <text x="270" y="322" text-anchor="start" class="mono" font-size="10.5">HTTP request</text>

          <!-- services <-> postgres, two parallel lines -->
          <g stroke="currentColor" fill="none" color="#6cc4ba">
            <line x1="612" y1="222" x2="716" y2="222" stroke-width="1.5" marker-end="url(#pf-arrow)"></line>
          </g>
          <text x="664" y="204" text-anchor="middle" class="mono" font-size="10.5" fill="#6cc4ba">writes</text>

          <g stroke="currentColor" fill="none" color="#6cc4ba">
            <line x1="716" y1="266" x2="612" y2="266" stroke-width="1.5" marker-end="url(#pf-arrow)"></line>
          </g>
          <text x="664" y="288" text-anchor="middle" class="mono" font-size="10.5" fill="#6cc4ba">reads</text>

          <!-- services -> packet adapter, orthogonal, clear of postgres -->
          <g stroke="currentColor" fill="none" color="#b48fd6">
            <path d="M 495 316 L 495 458 L 996 458" stroke-width="1.5" marker-end="url(#pf-arrow)"></path>
          </g>
          <text x="700" y="440" text-anchor="middle" class="mono" font-size="11" fill="#b48fd6">getPacket() → format()</text>

          <!-- packet adapter -> back to clients, dashed return -->
          <g stroke="currentColor" fill="none" color="#a89a80" stroke-dasharray="3 4">
            <path d="M 1120 530 L 1120 580 L 145 580 L 145 364" stroke-width="1.3" marker-end="url(#pf-arrow)"></path>
          </g>
          <text x="700" y="564" text-anchor="middle" class="mono" font-size="10.5" fill="#a89a80">formatted packet — one task's title, decisions and debt</text>
        </svg>